# ==========================================================
# 【何をする】①面談記録シートBot: PLAUDの「面談（名前）」録音を、スタッフ別タブの
#             スプレッドシートに時系列で自動記録。要約＋やること(TODO)をClaudeで抽出。
#            ②PLAUD配信Bot(share_bot.py): 録音タイトルをトリガーにPLAUD要約リンクを配信
#             （面談（桑野）→桑野さんDM／面談（斉藤）→斉藤さんDM／事務MTG→事務ルーム）。
#             予定曜日（木=事務MTG・金=面談（桑野））に録音が無ければ院長DMへアラート。
#            ③シノ面談 取り込みBot(shino_import.py): 院長スプシの「シノ面談の取り込み」タブに
#             貼られたPLAUD共有URLを読みに行き、要約＋TODOを該当スタッフのタブへ青い行で追記。
#             シノの録音は本人のPLAUDアカウントにあり院長のAPIからは見えないため、URLを入口にする。
# 【いつ動く】月〜土 21:00｜apotoolの sync_consult.yml から連鎖dispatchで起動
#            （Cron-job.orgは12件で満杯のため専用ジョブは作らず相乗り）
# 【共有先】  ①スプシは院長のみ（2026-07-25に軸コア共有を解除。幹部実施分のみ幹部シェア用スプシへ）
#            ②各配信先＋アラートは院長DM ③院長スプシのみ
# 【休診日】  休診日は面談も事務MTGもしないので、①②は何もせずに終わる（通知も送らない）。
#            とくに②は「木曜なのに事務MTGが無い」「金曜なのに面談（桑野）が無い」の
#            曜日アラートを持っているため、止めないと休診日に必ず誤爆する（院長指示 2026-08-12）。
#            ③シノ面談の取り込みは、貼られたURLを読むだけで診療の有無と関係ないため休診日も動かす。
#            判定は公開の休診日カレンダー（clinic_calendar.py）。お盆・年末年始・臨時休診は
#            祝日ではないので祝日判定だけでは拾えない。
# ==========================================================
name: 面談記録シートBot

on:
  workflow_dispatch:       # Cron-job.org から GitHub API 経由で起動
    inputs:
      share_mode:
        description: "配信Botのモード（空=本番 / test=全メッセージを院長DMのみに送る）"
        required: false
        default: ""

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Chromium をインストール（シノ面談取り込みでPLAUD共有ページを開くため）
        run: playwright install chromium --with-deps

      - name: 面談記録シートBotを実行
        env:
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CLAUDE_API_KEY:          ${{ secrets.CLAUDE_API_KEY }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
        run: python mendan_sheets.py

      - name: シノ面談 取り込みBotを実行（貼られたPLAUD共有URLを読み取り）
        if: always()    # 前ステップが失敗しても取り込みは実行する
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CLAUDE_API_KEY:          ${{ secrets.CLAUDE_API_KEY }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
        run: python shino_import.py

      - name: PLAUD配信Botを実行（面談・事務MTGのリンク配信）
        if: always()    # シートBotが失敗しても配信は実行する
        env:
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          LW_JIMU_CH:              ${{ secrets.LW_JIMU_CH }}
          SHARE_MODE:              ${{ inputs.share_mode }}
        run: python share_bot.py
