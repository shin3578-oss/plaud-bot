# ==========================================================
# 【何をする】軸ミーティングの議事録要約をLINEワークス「軸」チャンネルに投稿
# 【いつ動く】毎週 水・木・金・土 21:00｜Cron-job.org「軸MTG Bot」ジョブが起動
#            今週（月曜〜当日）の「軸MTG」録音のうち、まだ投稿していないものを探して投稿する。
#            水曜のうちにPLAUDへ上がらなかった録音も、土曜の夜まで毎晩拾いにいく（院長指示 2026-09-24）。
#            投稿済みかどうかは議事録Docsに書いた録音IDで判定＝同じ回を二度投稿しない。
# 【休診日】  今週の水曜が休診なら軸MTGはないので、何もせずに終わる（院長DMに1行・完了通知Bot 12786833）。
#            判定は公開の休診日カレンダー（clinic_calendar.py）。
# 【試運転】  dry_run=1 で、探す・判定するところまで。Docs追記・投稿・院長DMはしない。
# ==========================================================
name: 軸MTG Bot 議事録自動投稿

on:
  workflow_dispatch:       # Cron-job.org から GitHub API 経由で起動
    inputs:
      target_date:
        description: '取り直す録音日 (YYYY-MM-DD)。省略時は今週分の未投稿を探す'
        required: false
        default: ''
      dry_run:
        description: '1=試運転（投稿・通知しない）'
        required: false
        default: ''

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 軸MTG Botを実行
        env:
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_DOCS_ID:          ${{ secrets.GOOGLE_DOCS_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          LW_JIKU_CH:              ${{ secrets.LW_JIKU_CH }}
          TARGET_DATE:             ${{ github.event.inputs.target_date }}
          JIKU_DRY_RUN:            ${{ github.event.inputs.dry_run }}
        run: python plaud_bot.py
