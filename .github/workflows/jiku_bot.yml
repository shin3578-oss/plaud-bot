# ==========================================================
# 【何をする】軸ミーティングの議事録要約をLINEワークス「軸」チャンネルに投稿
# 【いつ動く】毎週水曜 21:00｜Cron-job.org「軸MTG Bot」ジョブが起動
# 【休診日】  休診日は軸MTGを開かないので、起動しても何もせずに終わる。
#            スキップしたことは院長DMに1行だけ知らせる（完了通知Bot 12786833）。
#            判定は公開の休診日カレンダー（clinic_calendar.py）。院長指示 2026-08-12
# 【2026年8月の一時措置】村田さんの卒業に伴い、8月中は軸チャンネルへ投稿せず
#   院長DMのみに送る（院長が通常LINEの「サブ軸」グループへ手動で共有）。
#   2026-09-01 から自動で軸チャンネル投稿に戻る（plaud_bot.py の CH_RESUME_DATE）。
# ==========================================================
name: 軸MTG Bot 議事録自動投稿

on:
  workflow_dispatch:       # Cron-job.org から GitHub API 経由で起動
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD) 省略時は当日'
        required: false
        default: ''

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 軸MTG Botを実行
        env:
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_DOCS_ID:          ${{ secrets.GOOGLE_DOCS_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          LW_JIKU_CH:              ${{ secrets.LW_JIKU_CH }}
          TARGET_DATE:             ${{ github.event.inputs.target_date }}
        run: python plaud_bot.py
