# ==========================================================
# 【何をする】朝練の録音要約をGoogleドキュメントに記録し、LINEワークス歯科医師チャンネルに投稿
# 【いつ動く】水〜土 9:00頃｜apotool の sassatopay.yml（月〜土9:00）が水〜土だけ連鎖dispatch
#            （2026-11-27 再開・院長「寺澤先生の朝練が水曜日から土曜日までつづくから」。
#             2026-08-21〜11-26は停止。Cron-job.org のジョブは12件上限のため作らない）
#            見つかるまで55分ごとに最大7回（〜14時台）探す。3回目（10:55頃）まで無ければ院長DMへ1回知らせる。
# 【同じ録音を二重に書かない】ドキュメントに同じ日付＋題名か共有リンクがあれば、記録も投稿もしない
# 【過去分の書き足し】target_date＋doc_only=true でドキュメントだけに書く（チャンネルには流さない）
# 【休診日】  休診日は朝練をしないので、起動しても何もせずに終わる。
#            スキップしたことは院長DMに1行だけ知らせる（完了通知Bot 12786833）。
#            判定は公開の休診日カレンダー（clinic_calendar.py）。
#            2026-08-12（お盆の水曜）に「朝練ファイルが見つかりません」を院長DMへ
#            誤送信したのが発端。お盆・年末年始・臨時休診は祝日ではないので、
#            祝日判定だけでは絶対に拾えない。
# ==========================================================
name: 朝練Bot 議事録自動投稿

on:
  workflow_dispatch:      # 手動実行 / Cron-job.org経由で起動
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD) 省略時は当日'
        required: false
        default: ''
      doc_only:
        description: 'ドキュメントにだけ書く（チャンネルへ投稿しない・過去分の書き足し用）'
        required: false
        default: 'false'
      no_notify:
        description: '誰にも送らない（試し実行）'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # クラウド実行は6時間で打ち切り。待ちは合計330分（asaren_bot.py）

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 朝練Botを実行
        env:
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_DOCS_ID_ASAREN:   ${{ secrets.GOOGLE_DOCS_ID_ASAREN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET:          ${{ secrets.LW_CLIENT_SECRET }}
          TARGET_DATE:             ${{ github.event.inputs.target_date }}
          DOC_ONLY:                ${{ github.event.inputs.doc_only }}
          NO_NOTIFY:               ${{ github.event.inputs.no_notify }}
        run: python asaren_bot.py

      - name: 失敗を院長DMへ（失敗通知Bot）
        if: failure() && github.event.inputs.no_notify != 'true'
        env:   # asaren_bot を読み込むと起動時に下の5つを読むので全部渡す
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_DOCS_ID_ASAREN:   ${{ secrets.GOOGLE_DOCS_ID_ASAREN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, asaren_bot as b
          b.send_alert_to_shincho("⚠️【朝練Bot】実行が失敗しました。ログ: " + os.environ["RUN_URL"], bot_id=b.LW_FAIL_BOT_ID)
          EOF
