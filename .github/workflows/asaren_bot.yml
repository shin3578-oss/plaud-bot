# ==========================================================
# 【何をする】朝練の録音要約をLINEワークス歯科医師チャンネルに投稿
# 【いつ動く】水・金 10:00｜Cron-job.org「朝練Bot」ジョブが起動（2026-08-06に水〜土から変更）
# 【休診日】  休診日は朝練をしないので、起動しても何もせずに終わる（通知も送らない）。
#            判定は公開の休診日カレンダー（clinic_calendar.py）。
#            2026-08-12（お盆の水曜）に「朝練ファイルが見つかりません」を院長DMへ
#            誤送信したのが発端。お盆・年末年始・臨時休診は祝日ではないので、
#            祝日判定だけでは絶対に拾えない。
# ==========================================================
name: 朝練Bot 議事録自動投稿

on:
  workflow_dispatch:      # 手動実行 / Cron-job.org経由で起動
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD) 省略時は当日'
        required: false
        default: ''

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 朝練Botを実行
        env:
          PLAUD_TOKEN:             ${{ secrets.PLAUD_TOKEN }}
          GOOGLE_DOCS_ID_ASAREN:   ${{ secrets.GOOGLE_DOCS_ID_ASAREN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          TARGET_DATE:             ${{ github.event.inputs.target_date }}
        run: python asaren_bot.py
